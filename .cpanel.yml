---
deployment:
  tasks:
    # Target: the live docroot. Only the paths listed here are ever written.
    # The repo holds no .htaccess (see .gitignore), so no .htaccess is ever copied or replaced.
    # Never copied: members config, splash.js, notify.js, anything outside the site tree.
    # Nothing on the server is deleted by a deploy.
    - export DEPLOYPATH=/home3/minion/public_html/thewayparty.com/
    # Docroot splash files
    - /bin/cp site/*.* $DEPLOYPATH
    # Public member area
    - /bin/mkdir -p ${DEPLOYPATH}members
    - /bin/cp -R site/members/. ${DEPLOYPATH}members/
    # Guides, maps, cases, news, states, pages under the locked preview area
    - /bin/mkdir -p ${DEPLOYPATH}preview/pages
    - /bin/cp -R site/preview/pages/. ${DEPLOYPATH}preview/pages/
    # Timeline, development, ai pages (noindex) at the docroot
    - /bin/mkdir -p ${DEPLOYPATH}timeline ${DEPLOYPATH}development ${DEPLOYPATH}ai
    - /bin/cp -R site/timeline/. ${DEPLOYPATH}timeline/
    - /bin/cp -R site/development/. ${DEPLOYPATH}development/
    - /bin/cp -R site/ai/. ${DEPLOYPATH}ai/
    # Layout scripts (candidate first screen, accordion)
    - /bin/mkdir -p ${DEPLOYPATH}layout
    - /bin/cp -R site/layout/. ${DEPLOYPATH}layout/
    # Research library
    - /bin/mkdir -p ${DEPLOYPATH}research
    - /bin/cp -R site/research/. ${DEPLOYPATH}research/
    # Search page
    - /bin/mkdir -p ${DEPLOYPATH}search
    - /bin/cp -R site/search/. ${DEPLOYPATH}search/
    # Permissions: files 0644, folders 0755, only inside the paths above
    - /usr/bin/find ${DEPLOYPATH}members ${DEPLOYPATH}preview/pages -type f ! -name .htaccess -exec /bin/chmod 0644 {} +
    - /usr/bin/find ${DEPLOYPATH}members ${DEPLOYPATH}preview/pages -type d -exec /bin/chmod 0755 {} +
    # Live ledger rows and checks: copied from the ledger-data branch (public raw files) so the ledger page stays same-origin.
    # A failure here never stops a deploy (the page works without these two files).
    - /bin/sh -c 'DEPLOYPATH=/home3/minion/public_html/thewayparty.com/; for f in live-rows checks; do /usr/bin/curl -fsS --max-time 20 -o ${DEPLOYPATH}development/data/$f.tmp https://raw.githubusercontent.com/wrxminion/The-way-site/ledger-data/$f.json && /bin/mv -f ${DEPLOYPATH}development/data/$f.tmp ${DEPLOYPATH}development/data/$f.json || /bin/rm -f ${DEPLOYPATH}development/data/$f.tmp; done; true'
    # Review status of AI-written pages: same idea, one file at the docroot. The seed in site/content-status.json is used if this fails.
    - /bin/sh -c 'DEPLOYPATH=/home3/minion/public_html/thewayparty.com/; /usr/bin/curl -fsS --max-time 20 -o ${DEPLOYPATH}content-status.tmp https://raw.githubusercontent.com/wrxminion/The-way-site/ledger-data/content-status.json && /bin/mv -f ${DEPLOYPATH}content-status.tmp ${DEPLOYPATH}content-status.json || /bin/rm -f ${DEPLOYPATH}content-status.tmp; true'
