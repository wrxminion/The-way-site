<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280">
<title>Dive into the news. See how deep it goes.</title>
<rect width="1200" height="280" fill="#efe6d0"/>
<rect x="10" y="10" width="1180" height="260" fill="none" stroke="#2a2418" stroke-width="3"/>
<rect x="18" y="18" width="1164" height="244" fill="none" stroke="#2a2418" stroke-width="1"/>
<g font-family="Georgia, 'Times New Roman', serif" fill="#1f1a10">
<text x="40" y="52" font-size="17" letter-spacing="4" font-weight="700">THE WAY</text>
<text x="1160" y="52" font-size="17" letter-spacing="4" text-anchor="end">NEWS, STATE BY STATE</text>
<line x1="34" y1="64" x2="1166" y2="64" stroke="#2a2418" stroke-width="2"/>
<text x="600" y="162" font-size="84" font-weight="900" text-anchor="middle" letter-spacing="-1" textLength="1090" lengthAdjust="spacingAndGlyphs">DIVE INTO THE NEWS</text>
<line x1="34" y1="184" x2="1166" y2="184" stroke="#2a2418" stroke-width="1"/>
<text x="600" y="222" font-size="26" font-style="italic" text-anchor="middle">See how deep it goes.</text>
</g>
<g stroke="#2a2418" stroke-opacity=".35" stroke-width="3" stroke-linecap="round">
<line x1="40" y1="240" x2="330" y2="240"/><line x1="40" y1="250" x2="260" y2="250"/>
<line x1="870" y1="240" x2="1160" y2="240"/><line x1="940" y1="250" x2="1160" y2="250"/>
</g>
</svg>
