<text x="160" y="40" fill="#1d2529" font-family="'Old English Text MT','UnifrakturMaguntia',Georgia,serif" font-size="22" font-weight="bold" text-anchor="middle">The Daily Way</text>
<path d="M74 46H246M74 57H246" stroke="#1d2529" stroke-width="1"/>
