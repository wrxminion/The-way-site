</g>
<g stroke="#6e4626" stroke-width="2" opacity=".6"><path d="M98 96h22M98 104h22M200 96h22M200 104h22M149 88h22M149 96h22"/></g>
<!-- table -->
<path d="M150 132h20l6 30h-32z" fill="url(#edge)"/>
