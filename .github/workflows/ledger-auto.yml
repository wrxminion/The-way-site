name: Ledger auto-post

# When a pull request is merged into main and its body has a line that starts
# with "ledger:", add one neutral row to the public development ledger at once.
# No second pull request: the row is written to a data branch, "ledger-data"
# (file live-rows.json), which the ledger page reads. Main is never touched, so
# the protection rule on main is not involved. Only the built-in GITHUB_TOKEN is used.
# The row text is the "ledger:" line, never the PR title or any other text.
# PRs labeled "do-not-publish", or with a body line that says only DO NOT PUBLISH
# (capitals, nothing else on the line), are skipped.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ledger-data
  cancel-in-progress: false

jobs:
  ledger:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'do-not-publish')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Add row to the ledger-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DATE: ${{ github.event.pull_request.merged_at }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -eu
          trap 'echo "::error::ledger step failed at script line $LINENO: $BASH_COMMAND"' ERR
          if printf '%s\n' "$PR_BODY" | tr -d '\r' | grep -qE '^[[:space:]]*DO NOT PUBLISH[[:space:]]*$'; then echo "marked do not publish"; exit 0; fi
          LINE=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | grep -m1 -iE '^ledger:[[:space:]]*[^[:space:]]' | sed -E 's/^[Ll][Ee][Dd][Gg][Ee][Rr]:[[:space:]]*//' || true)
          if [ -z "$LINE" ]; then echo "no ledger: line"; exit 0; fi
          case "$PR_AUTHOR" in wrxminion|ShihanOfMichi) ORIGIN="Maintainer";; *) ORIGIN="Contributor";; esac
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" ledger-data >/dev/null 2>&1; then
            git clone -q --depth=1 -b ledger-data "$URL" /tmp/data
          else
            git init -q -b ledger-data /tmp/data
            git -C /tmp/data remote add origin "$URL"
            echo '{"rows":[]}' > /tmp/data/live-rows.json
          fi
          node tools/ledger-live.js /tmp/data/live-rows.json "$PR_NUMBER" "${PR_DATE%%T*}" "$ORIGIN" "$LINE"
          cd /tmp/data
          git add live-rows.json
          if git diff --cached --quiet; then echo "nothing to add"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Ledger row for PR #$PR_NUMBER"
          git push -q origin HEAD:ledger-data
