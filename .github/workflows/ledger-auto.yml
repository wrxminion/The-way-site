name: Ledger auto-post

# When a pull request is merged into main, and ONLY if its body has a line that
# starts with "ledger:", open a small follow-up
# pull request that adds one neutral row to the public development ledger.
# The row text is the "ledger:" line, never the PR title or any other text.
# PRs labeled "do-not-publish", or with a body line that says only DO NOT PUBLISH (capitals, nothing else on the line), are skipped.
# Mentioning the phrase inside a sentence does not skip a post.
# No label is needed: the "ledger:" line is the opt-in.
# Main is protected, so this opens a PR for the maintainer to merge; it uses
# only the built-in GITHUB_TOKEN.

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  ledger:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !contains(github.event.pull_request.labels.*.name, 'do-not-publish') &&
      !startsWith(github.event.pull_request.head.ref, 'ledger-row/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Add ledger row and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_DATE: ${{ github.event.pull_request.merged_at }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -eu
          # If any command fails, name it in a public annotation so the cause can be read without logs.
          trap 'echo "::error::ledger step failed at script line $LINENO: $BASH_COMMAND"' ERR
          if printf '%s\n' "$PR_BODY" | tr -d '\r' | grep -qE '^[[:space:]]*DO NOT PUBLISH[[:space:]]*$'; then echo "marked do not publish"; exit 0; fi
          LINE=$(printf '%s\n' "$PR_BODY" | tr -d '\r' | grep -m1 -iE '^ledger:[[:space:]]*[^[:space:]]' | sed -E 's/^[Ll][Ee][Dd][Gg][Ee][Rr]:[[:space:]]*//' || true)
          if [ -z "$LINE" ]; then echo "no ledger: line"; exit 0; fi
          case "$PR_AUTHOR" in wrxminion|ShihanOfMichi) ORIGIN="Maintainer";; *) ORIGIN="Contributor";; esac
          node tools/ledger-append.js "$PR_NUMBER" "${PR_DATE%%T*}" "$ORIGIN" "$LINE"
          if git diff --quiet; then echo "nothing to add"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BR="ledger-row/pr-$PR_NUMBER"
          git checkout -b "$BR"
          git add site/development
          OUT=$(git commit -m "Ledger: add row for PR #$PR_NUMBER" 2>&1) || { echo "::error::commit failed: $(echo "$OUT" | tr '\n' ' ' | cut -c1-400)"; exit 1; }
          OUT=$(git push origin "$BR" 2>&1) || { echo "::error::push failed: $(echo "$OUT" | tr '\n' ' ' | cut -c1-400)"; exit 1; }
          OUT=$(gh pr create --base main --head "$BR" --title "Ledger: add row for PR #$PR_NUMBER" --body "Adds one public ledger row for #$PR_NUMBER, from its ledger: line. Check the wording, then merge. The site updates on the next quarter-hour deploy." 2>&1) || { echo "::error::pr create failed: $(echo "$OUT" | tr '\n' ' ' | cut -c1-400)"; exit 1; }
