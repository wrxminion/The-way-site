name: By the numbers (monthly)

# On the 3rd of each month (or by hand), ask the database for last month's public summary and, if it is ready,
# open a pull request that updates site/research/by-the-numbers-data.js and .json for the maintainer to merge.
# No secret is used: public.public_numbers() is readable with the site's public key (the same one in
# site/members/config.js), and it only returns counts that are safe to publish (see supabase/migrations/0029).
# The pull request uses the built-in GITHUB_TOKEN, like the ledger auto-post. Main is protected, so a person merges it.

on:
  schedule:
    - cron: '17 6 3 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch the public summary
        run: |
          URL=$(grep -o "supabaseUrl: '[^']*'" site/members/config.js | cut -d"'" -f2)
          KEY=$(grep -o "supabaseAnonKey: '[^']*'" site/members/config.js | cut -d"'" -f2)
          test -n "$URL" && test -n "$KEY"
          curl -sS --fail -X POST "$URL/rest/v1/rpc/public_numbers" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' -o "$RUNNER_TEMP/answer.json"
      - name: Build the static files
        run: node tools/build-by-the-numbers.js "$RUNNER_TEMP/answer.json"
      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- site/research; then echo "No change."; exit 0; fi
          MONTH=$(node -e "console.log(require('./site/research/by-the-numbers-data.json').month)")
          BRANCH="by-the-numbers/$MONTH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add site/research/by-the-numbers-data.js site/research/by-the-numbers-data.json
          git commit -m "By the numbers: $MONTH"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "By the numbers: $MONTH" \
            --body "Monthly update of the public numbers on the Research page. Counts under 10 already read \"under 10\". Generated by .github/workflows/by-the-numbers.yml."
