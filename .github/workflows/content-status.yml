name: Content status

# Every 15 minutes, read the review status of AI-written pages (set by admins in the members area) and copy the answer to
# content-status.json on the ledger-data branch, which the deploy publishes as /content-status.json. No secret:
# public.content_review_public() is readable with the site's public key (the one in site/members/config.js) and returns only
# page paths and statuses. Main is not touched.

on:
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ledger-data
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Copy the statuses to the ledger-data branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          SB=$(grep -o "supabaseUrl: '[^']*'" site/members/config.js | cut -d"'" -f2)
          KEY=$(grep -o "supabaseAnonKey: '[^']*'" site/members/config.js | cut -d"'" -f2)
          test -n "$SB" && test -n "$KEY"
          if ! curl -sS --fail -X POST "$SB/rest/v1/rpc/content_review_public" -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}' -o "$RUNNER_TEMP/content-status.json"; then
            echo "Database call failed (is migration 0044 run?). Nothing changed."; exit 0
          fi
          node -e "const j=JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'));if(typeof j.default!=='string'||!j.items||typeof j.items!=='object')process.exit(1);require('fs').writeFileSync(process.argv[1],JSON.stringify({default:j.default,items:j.items},null,2)+'\n')" "$RUNNER_TEMP/content-status.json"
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "$URL" ledger-data >/dev/null 2>&1; then
            git clone -q --depth=1 -b ledger-data "$URL" /tmp/data
          else
            git init -q -b ledger-data /tmp/data
            git -C /tmp/data remote add origin "$URL"
            echo '{"rows":[]}' > /tmp/data/live-rows.json
          fi
          cp "$RUNNER_TEMP/content-status.json" /tmp/data/content-status.json
          cd /tmp/data
          git add -A
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Content status"
          git push -q origin HEAD:ledger-data
